<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸间 · 项目与灵感</title>
<style>
:root{color-scheme:light;--paper:#f6f2e9;--ink:#292e2b;--muted:#62675c;--accent:#a44f36;--line:#dcd5c7;--serif:"Songti SC","STSong","Noto Serif CJK SC",serif;--sans:"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.7 var(--sans)}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #496f6b;outline-offset:4px}a{color:inherit;text-decoration-thickness:1px;text-underline-offset:5px}.shell{max-width:1184px;padding:0 32px;margin:auto}.skip{position:absolute;left:20px;top:-90px;background:#fffaf0;padding:10px;z-index:50}.skip:focus{top:10px}
header{min-height:96px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:700 31px/1.4 var(--serif);letter-spacing:.12em;text-decoration:none;display:flex;align-items:center;gap:13px;flex-shrink:0}.brand-mark{display:block;width:28px;height:32px;border:2px solid var(--ink);transform:rotate(-5deg);position:relative}.brand-mark:after{content:"";position:absolute;width:18px;left:7px;top:6px;border-top:2px solid var(--ink)}nav{display:flex;align-items:center;gap:28px}.text-button{border:0;background:none;padding:10px 0;color:var(--ink);text-decoration:underline;text-underline-offset:5px}.button{border:1px solid var(--accent);background:var(--accent);color:#fff9ee;padding:13px 25px;border-radius:7px;font-weight:600;line-height:1.4;transition:background .18s,transform .18s}.button:hover{background:#803d29;transform:translateY(-1px)}.button.secondary{background:transparent;border-color:#9a9d90;color:var(--ink)}.button.secondary:hover{background:#eeeadf}
.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:48px;align-items:center;padding:76px 0 72px}.hero-copy{min-width:0}.hero h1{font:600 clamp(46px,5.4vw,72px)/1.2 var(--serif);letter-spacing:-.04em;margin:0 0 24px}.lead{max-width:420px;font-size:19px;line-height:1.85;color:var(--muted);margin:0 0 30px}.actions{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.local-note{font-size:14px;line-height:1.7;color:var(--muted);margin:18px 0 0;max-width:410px}
.hero-art{width:100%;max-width:470px;aspect-ratio:1.08;position:relative;isolation:isolate;margin:0 auto}.hero-art:before{content:"";position:absolute;z-index:-1;inset:8% 1% 2%;border-radius:48%;background:radial-gradient(ellipse,#e4b58873 0,#e7d1aa55 44%,transparent 72%);filter:blur(15px)}.sheet{position:absolute;background:#fffaf0;border:1px solid #ddd4c3;box-shadow:0 13px 26px #6f503423,0 2px 5px #7c5d3517;overflow:hidden;border-radius:3px}.sheet-note{right:6%;top:4%;width:49%;height:76%;transform:rotate(9deg);background:repeating-linear-gradient(to bottom,#fcf7eb 0 31px,#d9d2c5 32px,#fcf7eb 33px);padding:23px;font-family:var(--serif)}.sheet-note p{margin:5px 0 0;font-size:16px;white-space:nowrap}.sheet-back{width:55%;height:66%;top:15%;left:5%;transform:rotate(-11deg);background:#d6d9c9}.sheet-front{width:71%;height:56%;top:41%;left:24%;transform:rotate(5deg);background:#cf825f;padding:9px}.sheet-front svg{border:1px solid #f7dfb180}.sheet svg{width:100%;height:100%;display:block}
.projects{border-top:1px solid var(--line);padding:38px 0 64px;scroll-margin-top:24px}.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:25px}.section-heading h2{font:600 31px/1.3 var(--serif);margin:0}.section-heading p{font-size:14px;margin:0;color:var(--muted)}.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px;align-items:start}.project-card{min-width:0}.project-open{width:100%;border:0;background:none;text-align:left;color:inherit;padding:0;display:block;border-radius:4px}.thumb{height:150px;background:#b6c2b4;border-radius:4px;display:block;position:relative;overflow:hidden}.thumb:before{content:"";position:absolute;width:53px;height:53px;background:#f2dfad;border-radius:50%;right:30px;top:19px}.thumb:after{content:"";position:absolute;inset:46px -15px -52px;background:#7e9485;transform:rotate(-15deg)}.project-card:nth-child(3n+2) .thumb{background:#d8a184}.project-card:nth-child(3n+2) .thumb:after{background:#9c604b;transform:rotate(15deg)}.project-card:nth-child(3n) .thumb{background:#b8c9ce}.project-card:nth-child(3n) .thumb:after{background:#6f9396}.project-card h3{font:600 21px/1.45 var(--serif);margin:15px 0 4px;overflow-wrap:anywhere}.project-card p{margin:0;color:var(--muted);font-size:14px}.project-open:hover h3{text-decoration:underline;text-underline-offset:5px}.status{padding:0 0 20px;color:#365b4f;margin:0;overflow-wrap:anywhere}.status:empty{padding:0}footer{border-top:1px solid var(--line);padding:24px 0 32px;color:var(--muted);font-size:13px}footer p{margin:0}footer p+p{margin-top:5px}
dialog{width:min(500px,calc(100% - 40px));max-height:calc(100dvh - 40px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:32px;color:var(--ink);background:#fffcf5;box-shadow:0 24px 90px #171b1940}dialog::backdrop{background:#25292166}dialog h2{font:600 31px/1.3 var(--serif);margin:0 0 18px;overflow-wrap:anywhere}dialog p{color:var(--muted)}.dialog-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:26px}label{display:block;font-weight:600;margin:22px 0 9px}input{width:100%;min-width:0;border:1px solid #9fa398;border-radius:6px;background:#fff;padding:12px;color:var(--ink)}input[aria-invalid="true"]{border:2px solid #a13228}.hint{font-size:14px;margin:8px 0}.error{color:#a13228;font-size:14px;margin:8px 0 0}.error:empty{margin:0}.notes{padding-left:22px}.notes li{margin:12px 0}.notes:empty{display:none}
@media(max-width:880px){.hero{gap:28px;padding:60px 0}.hero h1{font-size:54px}.hero-art{max-width:410px}.sheet-note{padding:18px}.lead{font-size:18px}.project-grid{gap:20px}.thumb{height:135px}}
@media(max-width:680px){.shell{padding:0 22px}header{min-height:80px}nav{gap:20px;font-size:14px}.brand{font-size:27px;gap:10px}.brand-mark{width:23px;height:29px}.brand-mark:after{width:14px;left:6px}.hero{grid-template-columns:1fr;gap:35px;padding:45px 0 42px}.hero h1{font-size:clamp(42px,8vw,54px)}.lead{max-width:420px;margin-bottom:25px}.hero-art{width:88%;max-width:370px}.sheet-note{padding:15px}.sheet-note p{font-size:14px}.sheet-front{padding:7px}.section-heading{align-items:flex-start;flex-direction:column;gap:7px;margin-bottom:22px}.section-heading h2{font-size:28px}.projects{padding:30px 0 44px}.project-grid{grid-template-columns:1fr;gap:30px}.thumb{height:auto;aspect-ratio:2.35}.project-card h3{margin-top:12px}.local-note{max-width:370px}.actions{gap:20px}dialog{padding:24px}dialog h2{font-size:28px}}
@media(max-width:360px){.shell{padding:0 18px}header{gap:12px}nav{gap:14px}.brand{font-size:25px}.hero-art{width:92%}.sheet-note p{font-size:12px}.actions{gap:18px}.button{padding:12px 19px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="shell">
<header><a class="brand" href="#main" aria-label="纸间首页"><span class="brand-mark" aria-hidden="true"></span>纸间</a><nav aria-label="主导航"><a href="#projects">项目</a><button class="text-button" type="button" data-create id="create-top">创建项目</button></nav></header>
<main id="main">
<section class="hero" aria-labelledby="hero-title">
<div class="hero-copy"><h1 id="hero-title">把灵感，<br>留在同一页。</h1><p class="lead">从一个名字开始，为下一次创作留个位置。</p><div class="actions"><button class="button" type="button" data-create id="create-hero">创建项目 <span aria-hidden="true">↗</span></button><a href="#projects">浏览示例项目</a></div><p class="local-note">项目仅保存在当前浏览器，不上传到服务器。</p></div>
<div class="hero-art" aria-hidden="true"><div class="sheet sheet-note"><p>秋日手记</p><p>光线 / 色彩 / 片刻</p></div><div class="sheet sheet-back"><svg viewBox="0 0 238 287" xmlns="http://www.w3.org/2000/svg"><rect width="238" height="287" fill="#d5d9ca"/><circle cx="168" cy="71" r="35" fill="#f5e4b8"/><path d="M0 237 103 93 238 287H0Z" fill="#95a48b"/><path d="m67 287 121-123 50 73v50Z" fill="#728b7c"/></svg></div><div class="sheet sheet-front"><svg viewBox="0 0 315 244" xmlns="http://www.w3.org/2000/svg"><rect width="315" height="244" fill="#cf825f"/><circle cx="221" cy="68" r="39" fill="#f5dda5"/><path d="M0 244V195L89 88l152 156Z" fill="#985e4b"/><path d="m80 244 145-103 90 62v41Z" fill="#b3684a"/></svg></div></div>
</section>
<section class="projects" id="projects" aria-labelledby="projects-title"><div class="section-heading"><h2 id="projects-title">项目</h2><p>浏览示例，或打开你创建的项目。</p></div><p class="status" id="project-status" role="status" aria-live="polite"></p><div class="project-grid" id="project-grid"></div></section>
</main><footer><p>纸间 · 原创交互示例</p><p>项目仅保存于此浏览器，清除浏览器数据会移除已创建的项目。</p></footer>
</div>
<dialog id="create-dialog" aria-labelledby="create-title"><form id="create-form" novalidate><h2 id="create-title">创建项目</h2><label for="project-name">项目名称</label><input id="project-name" name="projectName" type="text" maxlength="24" required aria-describedby="name-hint name-error" autocomplete="off" placeholder="例如：秋日摄影"><p id="name-hint" class="hint">1–24 个字符，仅保存在此浏览器。</p><p id="name-error" class="error" role="alert"></p><div class="dialog-actions"><button class="button secondary" data-close="create-dialog" type="button">取消</button><button class="button" type="submit">创建</button></div></form></dialog>
<dialog id="project-dialog" aria-labelledby="detail-title"><h2 id="detail-title"></h2><p id="detail-summary"></p><ul id="detail-notes" class="notes"></ul><div class="dialog-actions"><button class="button" data-close="project-dialog" type="button">关闭</button></div></dialog>
<script>
'use strict';
const STORAGE_KEY='page-simplify-original-example-v1';
const initialProjects=[{id:'demo-photo',name:'摄影手记',kind:'示例项目',notes:['留意傍晚窗边的光线。','试着用同一种色调组织照片。']},{id:'demo-brand',name:'品牌参考',kind:'示例项目',notes:['纸张、字体与留白的关系。','保留一个清楚的视觉记忆点。']},{id:'demo-weekend',name:'周末速写',kind:'示例项目',notes:['记下沿途看到的形状。','下一次，从一个小片段开始。']}];
let localProjects=[];let opener=null;
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(saved))localProjects=saved.filter(p=>p&&typeof p.name==='string'&&typeof p.id==='string').map(p=>({id:p.id,name:p.name.slice(0,24),kind:'本地项目',notes:[]}));}catch{}
const createDialog=document.getElementById('create-dialog'),detail=document.getElementById('project-dialog'),form=document.getElementById('create-form'),nameInput=document.getElementById('project-name'),error=document.getElementById('name-error');
function allProjects(){return [...initialProjects,...localProjects]}
function renderProjects(){const grid=document.getElementById('project-grid');grid.replaceChildren();allProjects().forEach(project=>{const card=document.createElement('article');card.className='project-card';const button=document.createElement('button');button.className='project-open';button.type='button';button.setAttribute('aria-label','打开项目：'+project.name);const thumb=document.createElement('span');thumb.className='thumb';thumb.setAttribute('aria-hidden','true');const heading=document.createElement('h3');heading.textContent=project.name;const summary=document.createElement('p');summary.textContent=project.kind+' · '+project.notes.length+' 条笔记';button.append(thumb,heading,summary);button.addEventListener('click',()=>openProject(project,button));card.append(button);grid.append(card);});}
function prepareCreate(){form.reset();error.textContent='';nameInput.removeAttribute('aria-invalid');createDialog.showModal();nameInput.focus();}
document.querySelectorAll('[data-create]').forEach(button=>button.addEventListener('click',()=>{opener=button;prepareCreate();}));
document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.close).close()));
[createDialog,detail].forEach(dialog=>dialog.addEventListener('close',()=>{if(!document.querySelector('dialog[open]'))opener?.focus();}));
nameInput.addEventListener('input',()=>{error.textContent='';nameInput.removeAttribute('aria-invalid');});
form.addEventListener('submit',event=>{event.preventDefault();const name=nameInput.value.trim();if(!name||Array.from(name).length>24){error.textContent='请输入 1–24 个字符的项目名称。';nameInput.setAttribute('aria-invalid','true');nameInput.focus();return;}const project={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name,kind:'本地项目',notes:[]};const next=[...localProjects,project];try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));}catch{error.textContent='浏览器未能保存项目，请检查存储权限后重试。';return;}localProjects=next;renderProjects();createDialog.close();document.getElementById('project-status').textContent='已创建“'+name+'”，并保存在此浏览器。';document.getElementById('projects').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
function openProject(project,button){opener=button;document.getElementById('detail-title').textContent=project.name;document.getElementById('detail-summary').textContent=project.notes.length?project.kind+' · '+project.notes.length+' 条笔记':'项目已创建。这份示例尚未提供添加图片或笔记的功能。';const notes=document.getElementById('detail-notes');notes.replaceChildren();project.notes.forEach(note=>{const item=document.createElement('li');item.textContent=note;notes.append(item);});detail.showModal();}
renderProjects();
</script>
</body>
</html>
